<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Industrial Control Hub v2.2</title>
<style>
:root {
--ok-bg: #064e3b; --ok-glow: #10b981;
--err-bg: #450a0a; --err-glow: #ef4444;
--bg: #020617; --panel: #1e293b; --accent: #3b82f6;
}

body {
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
background: var(--bg);
color: #f8fafc;
margin: 0;
display: flex;
height: 100vh;
overflow: hidden;
}

/* Bal oldali vezérlő sáv */
.sidebar {
width: 320px;
background: var(--panel);
border-right: 1px solid #334155;
display: flex;
flex-direction: column;
padding: 20px;
box-shadow: 5px 0 15px rgba(0,0,0,0.5);
}

/* Középső fő kijelző */
.main-display {
flex: 1;
display: flex;
flex-direction: column;
position: relative;
transition: background 0.2s ease;
}

.header-status {
padding: 20px 40px;
display: flex;
justify-content: space-between;
align-items: center;
background: rgba(15, 23, 42, 0.8);
border-bottom: 1px solid #334155;
}

/* Kereső egység */
.search-center {
flex: 1;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
padding: 40px;
}

input {
width: 100%;
max-width: 800px;
padding: 30px;
font-size: 4rem;
background: #000;
border: 4px solid var(--accent);
border-radius: 24px;
color: var(--accent);
text-align: center;
outline: none;
font-family: 'Consolas', monospace;
box-shadow: 0 0 40px rgba(59, 130, 246, 0.2);
}

/* Eredmény kártya */
.result-card {
margin-top: 50px;
text-align: center;
width: 100%;
}

.res-name { font-size: 6rem; font-weight: 900; margin: 0; line-height: 1; letter-spacing: -2px; }
.res-loc { font-size: 3.5rem; color: #94a3b8; margin-top: 15px; font-weight: 300; }

/* Szűrő stílus */
.filter-group { margin-bottom: 30px; }
label { display: block; font-size: 0.8rem; color: #94a3b8; margin-bottom: 8px; font-weight: bold; text-transform: uppercase; }

select {
width: 100%;
padding: 15px;
background: #0f172a;
color: #fff;
border: 1px solid var(--accent);
border-radius: 12px;
font-size: 1.1rem;
cursor: pointer;
}

/* Előzmények */
.history-list {
flex: 1;
overflow-y: auto;
margin-top: 10px;
scrollbar-width: thin;
}

.history-item {
padding: 15px;
margin-bottom: 10px;
background: rgba(0,0,0,0.4);
border-radius: 12px;
border-left: 5px solid #334155;
font-size: 0.9rem;
}
.hist-ok { border-left-color: var(--ok-glow); background: rgba(16, 185, 129, 0.05); }
.hist-err { border-left-color: var(--err-glow); background: rgba(239, 68, 68, 0.05); }

/* Állapot színek */
.bg-ok { background-color: var(--ok-bg) !important; }
.bg-err { background-color: var(--err-bg) !important; }
</style>
</head>
<body>

<div class="sidebar">
<div class="filter-group">
<label>Aktív Modell Szűrő</label>
<select id="dynamicModelSelector">
<option value="all">MINDEN MODELL</option>
</select>
</div>

<label>Utolsó 50 Művelet</label>
<div id="historyList" class="history-list"></div>
<button onclick="location.reload()" style="margin-top:10px; padding:12px; background:#334155; color:white; border:none; border-radius:10px; cursor:pointer;">Frissítés</button>
</div>

<div class="main-display" id="screen">
<div class="header-status">
<div style="font-size: 1.2rem; font-weight: bold; color: var(--accent);">FORVIA | MASZK SCANNER</div>
<div id="dbStatus" style="color: #4ade80;">Adatbázis: Betöltés...</div>
</div>

<div class="search-center">
<input type="text" id="barcodeInput" placeholder="SCAN NOW" autofocus autocomplete="off">

<div id="resultCard" class="result-card">
<div id="outPart" class="res-name">READY</div>
<div id="outLoc" class="res-loc">Csipogjon a kezdéshez</div>
</div>
</div>
</div>

<audio id="sndOk" src="https://actions.google.com/sounds/v1/communication/notification_high_intensity.ogg"></audio>
<audio id="sndError" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg"></audio>

<script>
const input = document.getElementById('barcodeInput');
const screen = document.getElementById('screen');
const modelSelector = document.getElementById('dynamicModelSelector');
const historyList = document.getElementById('historyList');

let database = [];
let models = new Set();

// CSV BETÖLTÉS ÉS MODELL KIGYŰJTÉS
// Feltételezzük: Cikkszám;Megnevezés;Helyszín;Modell
async function initSystem() {
await fetchCSV('bank.csv');
await fetchCSV('ultetes.csv');
updateModelDropdown();
document.getElementById('dbStatus').innerText = `Adatbázis: ${database.length} tétel`;
}

async function fetchCSV(file) {
try {
const res = await fetch(file);
const data = await res.text();
const lines = data.split('\n').slice(1);
lines.forEach(line => {
const parts = line.split(';');
if (parts.length >= 2) {
const modelName = parts[3] ? parts[3].trim() : "Egyéb";
database.push({
id: parts[0].trim().toUpperCase(),
name: parts[1].trim(),
loc: parts[2] ? parts[2].trim() : "-",
model: modelName
});
if (modelName) models.add(modelName);
}
});
} catch (e) { console.error(file + " hiba"); }
}

function updateModelDropdown() {
Array.from(models).sort().forEach(m => {
const opt = document.createElement('option');
opt.value = m;
opt.innerText = m;
modelSelector.appendChild(opt);
});
}

// FÓKUSZ ÉS MENÜ FIX
document.addEventListener('click', (e) => {
if (e.target.id !== 'dynamicModelSelector') input.focus();
});
modelSelector.addEventListener('change', () => input.focus());

// OLVASÁS
input.addEventListener('keypress', (e) => {
if (e.key === 'Enter') {
const val = input.value.trim().toUpperCase();
if (val) handleScan(val);
input.value = '';
}
});

function handleScan(code) {
const selectedModel = modelSelector.value;

const found = database.find(item => {
const idMatch = code.includes(item.id) || item.id.includes(code);
const modelMatch = (selectedModel === 'all' || item.model === selectedModel);
return idMatch && modelMatch;
});

if (found) {
triggerUI(true, found.name, found.loc, code, found.model);
} else {
triggerUI(false, "NEM KELL", "ISMERETLEN", code, "");
}
}

function triggerUI(isOk, name, loc, code, model) {
screen.className = "main-display " + (isOk ? "bg-ok" : "bg-err");
document.getElementById('outPart').innerText = name;
document.getElementById('outLoc').innerText = loc;

const snd = document.getElementById(isOk ? 'sndOk' : 'sndError');
snd.currentTime = 0;
snd.play().catch(()=>{});

// Előzmény
const div = document.createElement('div');
div.className = `history-item ${isOk ? 'hist-ok' : 'hist-err'}`;
div.innerHTML = `<strong>${code}</strong><br>${name} | ${model}<br><small>${new Date().toLocaleTimeString()}</small>`;
historyList.prepend(div);

setTimeout(() => screen.className = "main-display", 1000);
}

initSystem();
</script>
</body>
</html>
