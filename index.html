<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Industrial Hub v2.3</title>
<style>
:root {
--ok-bg: #064e3b; --ok-border: #10b981;
--err-bg: #450a0a; --err-border: #ef4444;
--bg: #020617; --panel: #1e293b; --accent: #3b82f6;
}

body {
font-family: 'Segoe UI', sans-serif;
background: var(--bg);
color: #f8fafc;
margin: 0;
display: flex;
height: 100vh;
overflow: hidden;
}

.sidebar {
width: 350px;
background: var(--panel);
border-right: 1px solid #334155;
display: flex;
flex-direction: column;
padding: 20px;
}

.main-display {
flex: 1;
display: flex;
flex-direction: column;
transition: background 0.1s ease;
}

.search-area {
flex: 1;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
padding: 20px;
}

input {
width: 90%;
max-width: 850px;
padding: 25px;
font-size: 4rem;
background: #000;
border: 4px solid var(--accent);
border-radius: 20px;
color: var(--accent);
text-align: center;
outline: none;
font-family: monospace;
}

.result-container {
margin-top: 40px;
text-align: center;
}

.res-name { font-size: 5.5rem; font-weight: 900; margin: 0; line-height: 1.1; }
.res-loc { font-size: 3.5rem; color: #fbbf24; margin-top: 20px; font-weight: bold; }

.history-list {
flex: 1;
overflow-y: auto;
margin-top: 15px;
font-size: 0.85rem;
}

.history-item {
padding: 10px;
margin-bottom: 8px;
border-radius: 8px;
background: rgba(0,0,0,0.3);
border-left: 5px solid #475569;
}
.h-ok { border-left-color: var(--ok-border); }
.h-err { border-left-color: var(--err-border); }

select {
width: 100%;
padding: 15px;
background: #0f172a;
color: white;
border: 2px solid var(--accent);
border-radius: 10px;
font-size: 1.1rem;
margin-bottom: 20px;
}

.bg-ok { background-color: var(--ok-bg) !important; }
.bg-err { background-color: var(--err-bg) !important; }

.status-bar { padding: 10px 20px; font-size: 0.8rem; background: #000; color: #64748b; display: flex; justify-content: space-between; }
</style>
</head>
<body>

<div class="sidebar">
<label style="color: #94a3b8; font-size: 0.7rem; font-weight: bold; text-transform: uppercase;">Modell kiválasztása</label>
<select id="modelSelector">
<option value="all">MINDEN MODELL</option>
</select>

<label style="color: #94a3b8; font-size: 0.7rem; font-weight: bold; text-transform: uppercase;">Előzmények</label>
<div id="historyList" class="history-list"></div>
<button onclick="location.reload()" style="padding: 10px; background: #334155; color: white; border: none; border-radius: 5px; cursor: pointer;">Adatok frissítése</button>
</div>

<div class="main-display" id="screen">
<div class="status-bar">
<span>FORVIA SYSTEM v2.3</span>
<span id="loadMsg">Adatok betöltése...</span>
</div>

<div class="search-area">
<input type="text" id="barcodeInput" placeholder="CSIPOGJON..." autofocus autocomplete="off">

<div class="result-container">
<div id="outPart" class="res-name">READY</div>
<div id="outLoc" class="res-loc">---</div>
</div>
</div>
</div>

<audio id="sndOk" src="https://actions.google.com/sounds/v1/communication/notification_high_intensity.ogg"></audio>
<audio id="sndError" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg"></audio>

<script>
const input = document.getElementById('barcodeInput');
const screen = document.getElementById('screen');
const modelSelector = document.getElementById('modelSelector');
const historyList = document.getElementById('historyList');

let bankDB = [];
let modelSet = new Set();

async function init() {
// 1. Ültetési adatokból CSAK a modellek kigyűjtése
await loadModelsOnly('ultetes.csv');
// 2. Bank adatokból minden (Cikkszám, Név, Hely, Modell)
await loadBankData('bank.csv');

populateModelSelector();
document.getElementById('loadMsg').innerText = `Adatbázis kész: ${bankDB.length} tétel`;
}

async function loadModelsOnly(file) {
try {
const res = await fetch(file);
const data = await res.text();
data.split('\n').slice(1).forEach(line => {
const cols = line.split(';');
if (cols[3]) modelSet.add(cols[3].trim()); // Modell oszlop
});
} catch (e) { console.error("Ültetés hiba"); }
}

async function loadBankData(file) {
try {
const res = await fetch(file);
const data = await res.text();
data.split('\n').slice(1).forEach(line => {
const cols = line.split(';');
if (cols.length >= 2) {
const modelName = cols[3] ? cols[3].trim() : "";
bankDB.push({
id: cols[0].trim().toUpperCase(),
name: cols[1].trim(),
loc: cols[2] ? cols[2].trim() : "NINCS HELY",
model: modelName
});
if (modelName) modelSet.add(modelName);
}
});
} catch (e) { console.error("Bank hiba"); }
}

function populateModelSelector() {
Array.from(modelSet).sort().forEach(m => {
const opt = document.createElement('option');
opt.value = m;
opt.innerText = m;
modelSelector.appendChild(opt);
});
}

// Fókusz fix
document.addEventListener('click', (e) => { if (e.target.id !== 'modelSelector') input.focus(); });
modelSelector.addEventListener('change', () => input.focus());

input.addEventListener('keypress', (e) => {
if (e.key === 'Enter') {
const code = input.value.trim().toUpperCase();
if (code) search(code);
input.value = '';
}
});

function search(code) {
const selectedModel = modelSelector.value;

// Keresés a BANK adatbázisban
const found = bankDB.find(item => {
const idMatch = code.includes(item.id) || item.id.includes(code);
const modelMatch = (selectedModel === 'all' || item.model === selectedModel);
return idMatch && modelMatch;
});

if (found) {
showResult(true, found.name, found.loc, code);
} else {
showResult(false, "NEM KELL / HIBA", "NINCS A BANKBAN", code);
}
}

function showResult(isOk, name, loc, code) {
// Háttérszín beállítása
screen.className = "main-display " + (isOk ? "bg-ok" : "bg-err");

// Szövegek kiírása
document.getElementById('outPart').innerText = name;
document.getElementById('outLoc').innerText = loc;

// Hang lejátszása
const audio = document.getElementById(isOk ? 'sndOk' : 'sndError');
audio.currentTime = 0;
audio.play().catch(()=>{});

// Előzmény
const div = document.createElement('div');
div.className = `history-item ${isOk ? 'h-ok' : 'h-err'}`;
div.innerHTML = `<strong>${code}</strong><br>${name}<br><small>${new Date().toLocaleTimeString()}</small>`;
historyList.prepend(div);

// NEM állítjuk vissza a színt automatikusan, marad a következő csipogásig
}

init();
</script>
</body>
</html>
