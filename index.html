<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Forvia Bank Scan Mobil Ver4.1</title>
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

<style>
/* --- PRO DESIGN VÁLTOZÓK (Változatlan) --- */
:root {
    --bg-dark: #0f172a;
    --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    --accent: #3b82f6;
    --accent-glow: rgba(59, 130, 246, 0.5);
    --glass: rgba(255, 255, 255, 0.05);
    --glass-border: rgba(255, 255, 255, 0.1);
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --ok-color: #10b981;
    --err-color: #ef4444;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg-gradient);
    color: var(--text-main);
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

/* --- FEJLÉC --- */
.header {
    background: rgba(15, 23, 42, 0.9);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--glass-border);
    padding: 15px 20px;
    text-align: center;
    z-index: 10;
    padding-top: max(15px, env(safe-area-inset-top));
}
.header h1 {
    margin: 0;
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: white;
}
.header .credits {
    font-size: 0.75rem;
    color: var(--text-muted);
    margin-top: 4px;
    font-weight: 500;
}
.header .credits span { color: var(--accent); }

/* --- FŐ TARTALOM --- */
.main-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 20px;
    overflow-y: auto;
    align-items: center;
}

/* --- KAMERA KONTÉNER --- */
#reader {
    width: 100%;
    max-width: 500px;
    border-radius: 20px;
    overflow: hidden;
    margin-bottom: 10px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    border: 2px solid var(--accent);
    display: none;
    background: black;
}
#reader video { object-fit: cover; border-radius: 20px; }

/* --- MÉRET SLIDER (ÚJ) --- */
.range-container {
    width: 100%;
    max-width: 300px;
    display: none; /* Csak kamera közben látszik */
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
    background: rgba(0,0,0,0.3);
    padding: 5px 15px;
    border-radius: 20px;
}
.range-label { font-size: 0.8rem; color: var(--accent); white-space: nowrap; }
input[type=range] {
    width: 100%;
    -webkit-appearance: none;
    background: transparent;
}
input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    height: 16px; width: 16px;
    border-radius: 50%;
    background: var(--accent);
    margin-top: -6px;
    box-shadow: 0 0 10px var(--accent);
}
input[type=range]::-webkit-slider-runnable-track {
    width: 100%; height: 4px;
    background: #475569;
    border-radius: 2px;
}

/* --- INPUT MEZŐ ÉS GOMB --- */
.input-wrapper {
    width: 100%;
    max-width: 500px;
    position: relative;
    display: flex;
    gap: 12px;
    margin-bottom: 25px;
}

input[type=text] {
    flex: 1;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    padding: 16px 20px;
    border-radius: 16px;
    color: white;
    font-size: 1.2rem;
    font-weight: 600;
    text-align: center;
    outline: none;
    transition: all 0.3s ease;
    backdrop-filter: blur(5px);
    box-shadow: 0 4px 6px rgba(0,0,0,0.2);
}
input[type=text]:focus {
    border-color: var(--accent);
    box-shadow: 0 0 20px var(--accent-glow);
}
input[type=text]::placeholder {
    color: rgba(255,255,255,0.3);
    font-weight: 400;
    text-transform: uppercase;
    font-size: 1rem;
}

.scan-btn {
    width: 60px;
    height: 60px;
    border-radius: 16px;
    border: none;
    background: var(--accent);
    color: white;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 15px var(--accent-glow);
    transition: transform 0.2s;
    flex-shrink: 0;
}
.scan-btn:active { transform: scale(0.92); }
.scan-btn svg { width: 28px; height: 28px; fill: white; }
.scan-btn.active { background: var(--err-color); box-shadow: 0 4px 15px rgba(239, 68, 68, 0.5); }

/* --- EREDMÉNY KÁRTYA --- */
#resultsWrapper { width: 100%; max-width: 500px; }

.result-card {
    background: rgba(16, 185, 129, 0.15);
    border: 1px solid var(--ok-color);
    border-radius: 20px;
    padding: 25px;
    text-align: center;
    animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    backdrop-filter: blur(10px);
}
.result-card.error {
    background: rgba(239, 68, 68, 0.15);
    border-color: var(--err-color);
}
@keyframes popIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }

.res-model { font-size: 1rem; color: var(--text-muted); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 5px; }
.res-main { font-size: 3rem; font-weight: 800; line-height: 1; color: white; margin: 10px 0; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
.res-pos { font-size: 1.5rem; color: #fbbf24; font-weight: bold; margin-bottom: 20px; }
.res-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.res-item { background: rgba(0,0,0,0.3); padding: 10px; border-radius: 12px; font-size: 0.9rem; color: var(--text-muted); }
.res-item b { display: block; color: white; font-size: 1.1rem; margin-top: 3px; }
.no-result { font-size: 1.5rem; font-weight: bold; color: var(--err-color); text-align: center; margin-top: 20px; }
.load-msg { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 15px; }

/* --- FOOTER --- */
.footer-history {
    background: rgba(15, 23, 42, 0.95);
    border-top: 1px solid var(--glass-border);
    height: 150px;
    overflow-y: auto;
    padding: 15px;
}
.history-title { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 10px; font-weight: bold; letter-spacing: 1px; }
.h-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 15px; margin-bottom: 8px;
    background: rgba(255,255,255,0.03); border-radius: 10px; font-size: 0.85rem;
    border-left: 4px solid #555;
}
.h-ok { border-left-color: var(--ok-color); }
.h-err { border-left-color: var(--err-color); }
.h-time { font-size: 0.7rem; color: #64748b; }

</style>
</head>
<body>

<div class="header">
    <h1>Forvia Bank Scan Mobil Ver4</h1>
    <div class="credits">Készítette: <span>Gergő Roland</span></div>
</div>

<div class="main-content" id="screen">
    <div id="loadMsg" class="load-msg">Adatbázis betöltése...</div>

    <div id="reader"></div>

    <div class="range-container" id="rangeContainer">
        <span class="range-label">Méret:</span>
        <input type="range" id="boxSizeSlider" min="150" max="400" value="280">
    </div>

    <div class="input-wrapper">
        <input type="text" id="barcodeInput" placeholder="Scan Barcode" autocomplete="off">
        
        <button class="scan-btn" onclick="toggleCamera()" title="Kamera indítása">
            <svg id="camIcon" viewBox="0 0 24 24">
                <path d="M4 6h2v12H4zm14 0h2v12h-2zm-4 0h2v12h-2zm-4 0h2v12h-2zM2 4v16h20V4H2zm18 14H4V6h16v12z"/>
                <path d="M0 0h24v24H0z" fill="none"/>
            </svg>
            <svg id="stopIcon" viewBox="0 0 24 24" style="display:none;">
                <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
            </svg>
        </button>
    </div>

    <div id="resultsWrapper"></div>
</div>

<div class="footer-history">
    <div class="history-title">Előzmények &middot; <span onclick="location.reload()" style="cursor:pointer; color:var(--accent);">Frissítés</span></div>
    <div id="historyList"></div>
</div>

<audio id="sndOk" src="https://actions.google.com/sounds/v1/communication/notification_high_intensity.ogg"></audio>
<audio id="sndError" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg"></audio>

<script>
const input = document.getElementById('barcodeInput');
const resultsWrapper = document.getElementById('resultsWrapper');
const historyList = document.getElementById('historyList');
const loadMsg = document.getElementById('loadMsg');
const camIcon = document.getElementById('camIcon');
const stopIcon = document.getElementById('stopIcon');
const scanBtn = document.querySelector('.scan-btn');
const rangeContainer = document.getElementById('rangeContainer');
const boxSizeSlider = document.getElementById('boxSizeSlider');

let html5QrcodeScanner = null;
let isCameraRunning = false;
let bankDB = [];
let currentBoxSize = 0; // Dinamikusan számoljuk

async function init() {
    await loadBankCSV();
    if(bankDB.length > 0) {
        loadMsg.innerText = `Adatbázis kész: ${bankDB.length} tétel`;
        loadMsg.style.color = "#10b981";
    }
    // Alapértelmezett méret beállítása a képernyő szélesség alapján
    const screenW = window.innerWidth;
    currentBoxSize = Math.min(Math.floor(screenW * 0.8), 350); 
    boxSizeSlider.value = currentBoxSize;
}

async function loadBankCSV() {
    try {
        const res = await fetch('bank.csv');
        const data = await res.text();
        const lines = data.split('\n');
        const headers = lines[0].split(';');
        let modelIdx = headers.findIndex(h => h.trim().toLowerCase().includes('model'));

        lines.slice(1).forEach(line => {
            const cols = line.split(';');
            if (cols.length < 2) return;
            bankDB.push({
                gep: cols[0]?.trim() || "N/A",
                poz: cols[1]?.trim() || "N/A",
                id: cols[2]?.trim().toUpperCase() || "",
                msd: cols[4]?.trim() || "N/A",
                model: (modelIdx !== -1 && cols[modelIdx]) ? cols[modelIdx].trim() : "BANK"
            });
        });
    } catch (e) { 
        loadMsg.innerText = "HIBA: bank.csv betöltése sikertelen!";
        loadMsg.style.color = "#ef4444";
    }
}

input.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') {
        const code = input.value.trim().toUpperCase();
        if (code) search(code);
        input.value = '';
        input.blur();
    }
});

function search(code) {
    resultsWrapper.innerHTML = '';
    const matches = bankDB.filter(i => (code.includes(i.id) || i.id.includes(code)) && i.id.length > 2);

    if (matches.length > 0) {
        playSound(true);
        matches.forEach(m => {
            const card = document.createElement('div');
            card.className = 'result-card';
            card.innerHTML = `
                <div class="res-model">${m.model}</div>
                <div class="res-main">${m.gep}</div>
                <div class="res-pos">POZ: ${m.poz}</div>
                <div class="res-grid">
                    <div class="res-item">MSD <b>${m.msd}</b></div>
                    <div class="res-item">ID <b>${m.id.slice(-5)}</b></div>
                </div>
            `;
            resultsWrapper.appendChild(card);
        });
        addToHistory(code, matches[0].gep, true);
    } else {
        playSound(false);
        resultsWrapper.innerHTML = '<div class="no-result">NINCS A LISTÁBAN</div>';
        addToHistory(code, "Nincs találat", false);
    }
}

// --- KAMERA LOGIKA FRISSÍTVE ---

function toggleCamera() {
    if (isCameraRunning) stopCamera();
    else startCamera();
}

// Slider esemény figyelése: ha változik, újraindítja a kamerát az új mérettel
boxSizeSlider.addEventListener('change', () => {
    if (isCameraRunning) {
        currentBoxSize = parseInt(boxSizeSlider.value);
        stopCamera();
        setTimeout(() => startCamera(), 300); // Kis késleltetés a simább váltásért
    }
});

function startCamera() {
    const readerDiv = document.getElementById('reader');
    readerDiv.style.display = 'block';
    camIcon.style.display = 'none';
    stopIcon.style.display = 'block';
    scanBtn.classList.add('active');
    rangeContainer.style.display = 'flex'; // Slider megjelenítése

    html5QrcodeScanner = new Html5Qrcode("reader");
    
    // Doboz méret használata a sliderből vagy az initből
    const boxW = parseInt(boxSizeSlider.value);
    const boxH = Math.floor(boxW * 0.6); // Téglalap arány a vonalkódokhoz (szélesebb)

    const config = { 
        fps: 10, 
        qrbox: { width: boxW, height: boxH }, 
        aspectRatio: 1.0 
    };
    
    html5QrcodeScanner.start(
        { facingMode: "environment" }, 
        config,
        (decodedText) => {
            stopCamera();
            input.value = decodedText;
            search(decodedText.trim().toUpperCase());
        },
        () => {}
    ).then(() => {
        isCameraRunning = true;
    }).catch(err => {
        alert("Kamera hiba: " + err);
        stopCamera();
    });
}

function stopCamera() {
    if (html5QrcodeScanner) {
        html5QrcodeScanner.stop().then(() => {
            html5QrcodeScanner.clear();
            document.getElementById('reader').style.display = 'none';
            rangeContainer.style.display = 'none'; // Slider elrejtése
            isCameraRunning = false;
            camIcon.style.display = 'block';
            stopIcon.style.display = 'none';
            scanBtn.classList.remove('active');
        }).catch(err => console.log(err));
    }
}

function playSound(ok) {
    const snd = document.getElementById(ok ? 'sndOk' : 'sndError');
    snd.currentTime = 0; snd.play().catch(()=>{});
}

function addToHistory(code, resText, ok) {
    const div = document.createElement('div');
    div.className = `h-item ${ok ? 'h-ok' : 'h-err'}`;
    const time = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
    div.innerHTML = `
        <div><strong>${code}</strong></div>
        <div style="text-align:right;">
            <div style="font-weight:bold; color: ${ok ? '#fff' : '#ef4444'}">${resText}</div>
            <div class="h-time">${time}</div>
        </div>`;
    historyList.prepend(div);
}

init();
</script>
</body>
</html>
