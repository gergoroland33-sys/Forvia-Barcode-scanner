<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forvia Multi-Model Scanner v3.2</title>
<style>
:root {
--ok-bg: #064e3b; --ok-border: #10b981;
--err-bg: #450a0a; --err-border: #ef4444;
--bg: #020617; --panel: #1e293b; --accent: #3b82f6;
}
body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: #f8fafc; margin: 0; display: flex; height: 100vh; overflow: hidden; }
.sidebar { width: 380px; background: var(--panel); border-right: 1px solid #334155; display: flex; flex-direction: column; padding: 20px; }
.main-display { flex: 1; display: flex; flex-direction: column; transition: background 0.1s ease; }
.search-area { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 20px; overflow-y: auto; }

input {
width: 90%; max-width: 800px; padding: 20px; font-size: 3rem; background: #000;
border: 4px solid var(--accent); border-radius: 20px; color: var(--accent);
text-align: center; outline: none; font-family: monospace; margin-bottom: 30px;
}

/* Találati kártyák konténere */
#resultsWrapper { width: 95%; display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; }

.result-card {
background: rgba(0,0,0,0.4); border: 2px solid var(--accent); border-radius: 20px;
padding: 20px; width: 400px; text-align: center; animation: slideUp 0.3s ease;
}
@keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

.res-model { font-size: 1.8rem; font-weight: 800; color: var(--accent); text-transform: uppercase; border-bottom: 1px solid #334155; padding-bottom: 10px; margin-bottom: 15px; }
.res-main { font-size: 3rem; font-weight: 900; line-height: 1; }
.res-pos { font-size: 2rem; color: #fbbf24; margin-top: 10px; font-weight: bold; }
.res-info { font-size: 1.2rem; color: #94a3b8; margin-top: 15px; display: flex; justify-content: space-around; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 10px; }

.history-list { flex: 1; overflow-y: auto; margin-top: 15px; }
.history-item { padding: 12px; margin-bottom: 8px; border-radius: 8px; background: rgba(0,0,0,0.3); border-left: 5px solid #475569; font-size: 0.85rem; }
.h-ok { border-left-color: var(--ok-border); }
.h-err { border-left-color: var(--err-border); }

select { width: 100%; padding: 15px; background: #0f172a; color: white; border: 2px solid var(--accent); border-radius: 10px; font-size: 1.2rem; margin-bottom: 20px; outline: none; }
.bg-ok { background-color: var(--ok-bg) !important; }
.bg-err { background-color: var(--err-bg) !important; }
.status-bar { padding: 10px 20px; font-size: 0.8rem; background: #000; color: #64748b; display: flex; justify-content: space-between; border-bottom: 1px solid #334155; }
</style>
</head>
<body>
<div class="sidebar">
<label style="color: #94a3b8; font-size: 0.75rem; font-weight: bold; text-transform: uppercase;">Modell Szűrő</label>
<select id="modelSelector"><option value="all">MINDEN MODELL (ÖSSZESÍTETT)</option></select>
<div id="historyList" class="history-list"></div>
<button onclick="location.reload()" style="padding: 10px; background: #334155; color: white; border: none; border-radius: 5px; cursor: pointer;">Adatok Frissítése</button>
</div>

<div class="main-display" id="screen">
<div class="status-bar"><span>FORVIA MULTI-SCAN v3.2</span><span id="loadMsg">Betöltés...</span></div>
<div class="search-area">
<input type="text" id="barcodeInput" placeholder="BEOLVASÁS..." autofocus autocomplete="off">
<div id="resultsWrapper">
</div>
</div>
</div>

<audio id="sndOk" src="https://actions.google.com/sounds/v1/communication/notification_high_intensity.ogg"></audio>
<audio id="sndError" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg"></audio>

<script>
const input = document.getElementById('barcodeInput');
const screen = document.getElementById('screen');
const modelSelector = document.getElementById('modelSelector');
const resultsWrapper = document.getElementById('resultsWrapper');
const historyList = document.getElementById('historyList');

let fullDB = [];
let modelSet = new Set();

async function init() {
await loadCSV('bank.csv', 'bank');
await loadCSV('ultetes.csv', 'ultetes');
populateModelSelector();
document.getElementById('loadMsg').innerText = `Adatbázis: ${fullDB.length} tétel`;
}

async function loadCSV(file, source) {
try {
const res = await fetch(file);
const data = await res.text();
const lines = data.split('\n');
const headers = lines[0].split(';');

lines.slice(1).forEach(line => {
const cols = line.split(';');
if (cols.length < 2) return;

let modelIdx = headers.findIndex(h => h.trim().toLowerCase().includes('model'));
let currentModel = (modelIdx !== -1 && cols[modelIdx]) ? cols[modelIdx].trim() : "ISMERETLEN";
if(currentModel) modelSet.add(currentModel);

if (source === 'bank') {
fullDB.push({
id: cols[2]?.trim().toUpperCase() || "",
gep: cols[0]?.trim() || "N/A",
poz: cols[1]?.trim() || "N/A",
msd: cols[4]?.trim() || "N/A",
model: currentModel
});
} else {
fullDB.push({
id: cols[0]?.trim().toUpperCase() || "",
gep: "ÜLTETÉS",
poz: "OK",
msd: "N/A",
model: (cols[4] ? cols[4].trim() : currentModel)
});
}
});
} catch (e) { console.error(file + " hiba"); }
}

function populateModelSelector() {
Array.from(modelSet).sort().forEach(m => {
if(!m) return;
const opt = document.createElement('option');
opt.value = m; opt.innerText = m;
modelSelector.appendChild(opt);
});
}

input.addEventListener('keypress', (e) => {
if (e.key === 'Enter') {
const code = input.value.trim().toUpperCase();
if (code) search(code);
input.value = '';
}
});

function search(code) {
const selectedModel = modelSelector.value;
resultsWrapper.innerHTML = ''; // Régi találatok törlése

// ÖSSZES találat kigyűjtése a cikkszám alapján
const matches = fullDB.filter(i =>
(code.includes(i.id) || i.id.includes(code)) &&
(selectedModel === 'all' || i.model === selectedModel)
);

if (matches.length > 0) {
screen.className = "main-display bg-ok";
playSound(true);

matches.forEach(m => {
const card = document.createElement('div');
card.className = 'result-card';
card.innerHTML = `
<div class="res-model">${m.model}</div>
<div class="res-main">${m.gep}</div>
<div class="res-pos">POZ: ${m.poz}</div>
<div class="res-info">
<span>MSD: <b>${m.msd}</b></span>
<span>ID: <b>${m.id.slice(-5)}</b></span>
</div>
`;
resultsWrapper.appendChild(card);
});
addToHistory(code, `${matches.length} modellnél találat`, true);
} else {
screen.className = "main-display bg-err";
playSound(false);
resultsWrapper.innerHTML = '<div style="font-size:3rem; font-weight:bold;">NINCS TALÁLAT</div>';
addToHistory(code, "Nincs a listában", false);
}
}

function playSound(ok) {
const snd = document.getElementById(ok ? 'sndOk' : 'sndError');
snd.currentTime = 0; snd.play().catch(()=>{});
}

function addToHistory(code, text, ok) {
const div = document.createElement('div');
div.className = `history-item ${ok ? 'h-ok' : 'h-err'}`;
div.innerHTML = `<strong>${code}</strong> - ${text}<br><small>${new Date().toLocaleTimeString()}</small>`;
historyList.prepend(div);
}

init();
</script>
</body>
</html>
