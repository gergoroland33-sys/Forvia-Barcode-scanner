<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Industrial Part Checker v2.0</title>
<style>
:root {
--ok-bg: #064e3b; --ok-border: #10b981;
--err-bg: #7f1d1d; --err-border: #ef4444;
--bg: #0f172a; --panel: #1e293b;
}

body {
font-family: 'Segoe UI', sans-serif;
background: var(--bg);
color: white;
margin: 0;
overflow: hidden; /* Fix laptop kijelző */
display: flex;
height: 100vh;
}

/* Fő panel */
.main-panel {
flex: 2;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
transition: background 0.1s ease;
position: relative;
}

/* Állapotjelző színek */
.status-ok { background-color: var(--ok-bg) !important; }
.status-error { background-color: var(--err-bg) !important; }

.search-container {
width: 80%;
max-width: 800px;
text-align: center;
z-index: 10;
}

input {
width: 100%;
padding: 20px;
font-size: 3.5rem;
background: rgba(0,0,0,0.5);
border: 4px solid #334155;
border-radius: 15px;
color: #3b82f6;
text-align: center;
outline: none;
font-family: monospace;
}

/* Eredmény kijelző */
.result-display {
margin-top: 40px;
min-height: 200px;
text-align: center;
}

.part-name { font-size: 5rem; font-weight: 900; margin: 0; text-transform: uppercase; }
.location-info { font-size: 2.5rem; color: #cbd5e1; }

/* Oldalsó előzmények */
.history-panel {
flex: 0.6;
background: var(--panel);
border-left: 2px solid #334155;
padding: 20px;
display: flex;
flex-direction: column;
}

.history-list {
flex-grow: 1;
overflow-y: auto;
margin-top: 15px;
}

.history-item {
padding: 10px;
margin-bottom: 5px;
border-radius: 8px;
background: rgba(0,0,0,0.2);
font-size: 0.9rem;
border-left: 4px solid #3b82f6;
}

.hist-ok { border-color: #10b981; }
.hist-err { border-color: #ef4444; }

/* Szűrő / Modell választó */
.filter-bar {
position: absolute;
top: 20px;
left: 20px;
display: flex;
gap: 15px;
}

select {
padding: 10px;
background: #334155;
color: white;
border: 1px solid #475569;
border-radius: 5px;
}
</style>
</head>
<body>

<div class="main-panel" id="screen">
<div class="filter-bar">
<select id="modelFilter">
<option value="all">ÖSSZES MODELL</option>
<option value="bank">BANK CSV</option>
<option value="ultetes">ÜLTETÉS CSV</option>
</select>
</div>

<div class="search-container">
<input type="text" id="barcodeInput" placeholder="VÁRAKOZÁS OLVASÁSRA..." autofocus>

<div class="result-display">
<div id="outPart" class="part-name">---</div>
<div id="outLoc" class="location-info">Beolvasásra kész</div>
</div>
</div>
</div>

<div class="history-panel">
<h3>🕒 ELŐZMÉNYEK</h3>
<div id="historyList" class="history-list"></div>
<button onclick="clearHistory()" style="background: none; border: 1px solid #475569; color: gray; cursor: pointer; padding: 5px;">Törlés</button>
</div>

<audio id="sndOk" src="https://actions.google.com/sounds/v1/communication/notification_high_intensity.ogg"></audio>
<audio id="sndError" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg"></audio>

<script>
const input = document.getElementById('barcodeInput');
const screen = document.getElementById('screen');
const outPart = document.getElementById('outPart');
const outLoc = document.getElementById('outLoc');
const historyList = document.getElementById('historyList');
const sndOk = document.getElementById('sndOk');
const sndError = document.getElementById('sndError');

let database = [];

// Szimulált adatbázis betöltés (Ide jön a CSV fetch logikád)
// Megjegyzés: A valóságban ide töltsd be a két CSV-t egy tömbbe
function loadData() {
// Példa adatok
database = [
{ id: "CLA_125903490", name: "CSAVAR M6", loc: "SZEKRÉNY 1", type: "bank" },
{ id: "BOSCH_99822", name: "MOTOR EGYSÉG", loc: "FAKK 12", type: "ultetes" }
];
}
loadData();

// Fókusz kényszerítése (hogy mindig tudj csipogni)
document.addEventListener('click', () => input.focus());

input.addEventListener('keypress', function (e) {
if (e.key === 'Enter') {
processScan(this.value.trim());
this.value = '';
}
});

function processScan(scannedCode) {
const filter = document.getElementById('modelFilter').value;

// KERESÉS: Részleges egyezés figyelése (includes)
const found = database.find(item => {
const match = scannedCode.includes(item.id);
const typeMatch = (filter === 'all' || item.type === filter);
return match && typeMatch;
});

if (found) {
handleResult(true, found.name, found.loc, scannedCode);
} else {
handleResult(false, "ISMERETLEN", "NINCS A LISTÁBAN", scannedCode);
}
}

function handleResult(isOk, name, loc, code) {
// Vizuális hatás
screen.className = "main-panel " + (isOk ? "status-ok" : "status-error");
outPart.innerText = name;
outLoc.innerText = loc;

// Hangjelzés (azonnali lejátszás)
const snd = isOk ? sndOk : sndError;
snd.currentTime = 0;
snd.play();

// Előzmény mentése
const item = document.createElement('div');
item.className = `history-item ${isOk ? 'hist-ok' : 'hist-err'}`;
item.innerHTML = `<strong>${new Date().toLocaleTimeString()}</strong>: ${code} <br> ➔ ${name} [${loc}]`;
historyList.prepend(item);

// Rövid villanás után visszaállás
setTimeout(() => {
screen.className = "main-panel";
}, 800);
}

function clearHistory() { historyList.innerHTML = ''; }
</script>
</body>
</html>
