<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forvia Pro Scanner v3.0</title>
<style>
:root {
--ok-bg: #064e3b; --ok-border: #10b981;
--err-bg: #450a0a; --err-border: #ef4444;
--bg: #020617; --panel: #1e293b; --accent: #3b82f6;
}
body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: #f8fafc; margin: 0; display: flex; height: 100vh; overflow: hidden; }
.sidebar { width: 350px; background: var(--panel); border-right: 1px solid #334155; display: flex; flex-direction: column; padding: 20px; }
.main-display { flex: 1; display: flex; flex-direction: column; transition: background 0.1s ease; }
.search-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
input { width: 90%; max-width: 850px; padding: 20px; font-size: 3.5rem; background: #000; border: 4px solid var(--accent); border-radius: 20px; color: var(--accent); text-align: center; outline: none; font-family: monospace; }
.result-container { margin-top: 30px; text-align: center; width: 90%; }
.res-main { font-size: 5rem; font-weight: 900; margin: 0; line-height: 1.1; }
.res-sub { font-size: 2.5rem; color: #fbbf24; margin-top: 15px; font-weight: bold; }
.res-details { font-size: 1.8rem; color: #94a3b8; margin-top: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.history-list { flex: 1; overflow-y: auto; margin-top: 15px; }
.history-item { padding: 10px; margin-bottom: 8px; border-radius: 8px; background: rgba(0,0,0,0.3); border-left: 5px solid #475569; font-size: 0.85rem; }
.h-ok { border-left-color: var(--ok-border); }
.h-err { border-left-color: var(--err-border); }
select { width: 100%; padding: 15px; background: #0f172a; color: white; border: 2px solid var(--accent); border-radius: 10px; font-size: 1.1rem; margin-bottom: 20px; outline: none; }
.bg-ok { background-color: var(--ok-bg) !important; }
.bg-err { background-color: var(--err-bg) !important; }
.status-bar { padding: 10px 20px; font-size: 0.8rem; background: #000; color: #64748b; display: flex; justify-content: space-between; border-bottom: 1px solid #334155; }
</style>
</head>
<body>
<div class="sidebar">
<label style="color: #94a3b8; font-size: 0.7rem; font-weight: bold; text-transform: uppercase;">Modell kiválasztása</label>
<select id="modelSelector"><option value="all">MINDEN MODELL</option></select>
<label style="color: #94a3b8; font-size: 0.7rem; font-weight: bold; text-transform: uppercase;">Előzmények</label>
<div id="historyList" class="history-list"></div>
<button onclick="location.reload()" style="padding: 10px; background: #334155; color: white; border: none; border-radius: 5px; cursor: pointer;">Frissítés</button>
</div>
<div class="main-display" id="screen">
<div class="status-bar"><span>FORVIA INDUSTRIAL SCANNER v3.0</span><span id="loadMsg">Adatok betöltése...</span></div>
<div class="search-area">
<input type="text" id="barcodeInput" placeholder="CSIPOGJON..." autofocus autocomplete="off">
<div class="result-container">
<div id="outPart" class="res-main">READY</div>
<div id="outPos" class="res-sub">---</div>
<div id="outDetails" class="res-details"></div>
</div>
</div>
</div>
<audio id="sndOk" src="https://actions.google.com/sounds/v1/communication/notification_high_intensity.ogg"></audio>
<audio id="sndError" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg"></audio>

<script>
const input = document.getElementById('barcodeInput');
const screen = document.getElementById('screen');
const modelSelector = document.getElementById('modelSelector');
const historyList = document.getElementById('historyList');
let bankDB = [];
let ultetesDB = [];
let modelSet = new Set();

async function init() {
await loadCSV('bank.csv', 'bank');
await loadCSV('ultetes.csv', 'ultetes');
populateModelSelector();
document.getElementById('loadMsg').innerText = `Adatbázis: ${bankDB.length + ultetesDB.length} tétel`;
}

async function loadCSV(file, type) {
try {
const res = await fetch(file);
const data = await res.text();
const lines = data.split('\n');
const headers = lines[0].split(';');

lines.slice(1).forEach(line => {
const cols = line.split(';');
if (cols.length < 2) return;

// Modell kinyerése (Képek alapján mindkét fájlban a 'Model' oszlopban van)
const modelIdx = headers.findIndex(h => h.trim().toLowerCase() === 'model');
if (modelIdx !== -1 && cols[modelIdx]) modelSet.add(cols[modelIdx].trim());

if (type === 'bank') {
bankDB.push({
gep: cols[0]?.trim() || "",
poz: cols[1]?.trim() || "",
id: cols[2]?.trim().toUpperCase() || "",
model: cols[3]?.trim() || "",
msd: cols[4]?.trim() || ""
});
} else {
ultetesDB.push({
id: cols[0]?.trim().toUpperCase() || "",
model: cols[4]?.trim() || "" // Ultetes.csv-nél az 5. oszlop a Model a kép alapján
});
}
});
} catch (e) { console.error(file + " hiba"); }
}

function populateModelSelector() {
Array.from(modelSet).sort().forEach(m => {
const opt = document.createElement('option');
opt.value = m; opt.innerText = m;
modelSelector.appendChild(opt);
});
}

document.addEventListener('click', (e) => { if (e.target.id !== 'modelSelector') input.focus(); });
modelSelector.addEventListener('change', () => input.focus());

input.addEventListener('keypress', (e) => {
if (e.key === 'Enter') {
const code = input.value.trim().toUpperCase();
if (code) search(code);
input.value = '';
}
});

function search(code) {
const selectedModel = modelSelector.value;

// Keresés mindkét táblában
const inBank = bankDB.find(i => (code.includes(i.id) || i.id.includes(code)) && (selectedModel === 'all' || i.model === selectedModel));
const inUltetes = ultetesDB.find(i => (code.includes(i.id) || i.id.includes(code)) && (selectedModel === 'all' || i.model === selectedModel));

if (inBank) {
showResult(true, inBank.gep, `POZÍCIÓ: ${inBank.poz}`, inBank.id, inBank.msd);
} else if (inUltetes) {
showResult(true, "ÜLTETÉS EGYEZÉS", "CSAK CIKKSZÁM OK", inUltetes.id, "N/A");
} else {
showResult(false, "NEM KELL / HIBA", "NINCS TALÁLAT", code, "");
}
}

function showResult(isOk, main, sub, id, msd) {
screen.className = "main-display " + (isOk ? "bg-ok" : "bg-err");
document.getElementById('outPart').innerText = main;
document.getElementById('outPos').innerText = sub;
document.getElementById('outDetails').innerHTML = isOk ? `<div>CIKKSZÁM: ${id}</div><div>MSD: ${msd}</div>` : "";

const audio = document.getElementById(isOk ? 'sndOk' : 'sndError');
audio.currentTime = 0; audio.play().catch(()=>{});

const div = document.createElement('div');
div.className = `history-item ${isOk ? 'h-ok' : 'h-err'}`;
div.innerHTML = `<strong>${id}</strong><br>${main} - ${sub}<br><small>${new Date().toLocaleTimeString()}</small>`;
historyList.prepend(div);
}
init();
</script>
</body>
</html>
